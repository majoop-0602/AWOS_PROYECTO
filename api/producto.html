<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="js/main.js" defer></script>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body id="page-top">
     <nav class="navbar navbar-expand-sm"> 
                <div class="container-fluid">
                    <a class="navbar-brand fw-bold" href="#page-top">Segunda Vuelta</a>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#producto">Producto</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="productitos.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-purple" onclick="window.location.href=''">
                                Cerrar Sesión
                            </button>
                        </li>
                    </ul>
                </div>
            </nav>
    <div id="producto" class="container">
        <form id="frmProducto" method="POST" enctype="multipart/form-data">
            <h1 class="mt-4 mb-4">Productos</h1>
            <div class="input2-1-box mb-3">
                <input type="text" id="txtId" name="txtId" class="form-control" placeholder=" " readonly>
                 <label for="txtId">ID</label>
            </div>
            <div class="input2-box mb-3">
                <input type="text" id="txtTitulo" name="txtTitulo" required>
                <label for="txtTitulo">Titulo</label>
            </div>
            <div class="input2-box mb-3">
                <textarea id="txtDescripcion" name="txtDescripcion" required></textarea>
                <label for="txtDescripcion">Descripcion</label>
            </div>
            <div class="input2-box mb-3">
                <input type="number" id="txtPrecio" name="txtPrecio" required>
                <label for="txtPrecio">Precio</label>
            </div>
             <div class="input2-box mb-3">
                <input type="file" id="txtimagen" name="txtimagen" accept="image/*" hidden>
                
                <label for="txtimagen" class="file-label">
                    Seleccionar imagen
                </label>
            </div>
            <br>
            <div class="input2-box mb-3">
                <input type="text" id="txtTalla" name="txtTalla" required>
                <label for="txtTalla">Talla</label>
            </div>
           <div class="input2-box mb-3">
                <select type="text" id="cboEstado" name="cboEstado" required>
                        <option value="" disabled selected hidden></option>
                        <option value="Nuevo">Nuevo</option>
                        <option value="Seminuevo">Seminuevo</option>
                        <option value="Usado">Usado</option>
                </select>
                <label for="cboEstado">Estado</label>
            </div>
            <div class="input2-box mb-3">
                <select type="text" id="cboIdCat" name="cboIdCat" required>
                    <option value="" disabled selected hidden></option>
                </select>
                 <label for="cboIdCat">Categoria</label>
            </div>
             <div class="input2-box mb-3">
                <select type="text" id="cboIdVendedor" name="cboIdVendedor" required>
                    <option value="" disabled selected hidden></option>
                </select>
                  <label for="cboIdVendedor">Vendedor</label>
            </div>
              <div class="input2-box mb-3">
                <select type="text" id="cboDisponible" name="cboDisponible" required>
                        <option value="" disabled selected hidden></option>
                        <option value="1">Si</option>
                        <option value="0">No</option>
                </select>
                <label for="cboDisponible">Disponible</label>
            </div>
            <div class="mb-1"><br>
                <button type="submit" class="btn btn-purple">Guardar</button>
                <button type="reset" class="btn btn-purple">Cancelar</button>
            </div>
        </form>
        <br>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titulo</th>
                    <th>Descripcion</th>
                    <th>Precio</th>
                    <th>Imagen</th>
                    <th>Talla</th>
                    <th>Estado</th>
                    <th>ID Categoria</th>
                    <th>ID Vendedor</th>
                    <th>Disponible</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody id="tbodyProductos">
            </tbody>
        </table>

         <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Nueva Notificación</strong>
                <small></small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                Hubo un cambio en los productos!
            </div>
        </div>
    </div>
    </div>
</body>
</html>
