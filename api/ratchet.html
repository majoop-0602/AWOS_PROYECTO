<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="js/ratchet.js" defer></script>
    <link href="css/style.css" rel="stylesheet"/>
</head>

<body>
    <div class="container">
        <div class="row">
             <h2 class="mt-4 mb-4">Chat</h2>
            <div class="col-12 col-sm-12 col-md-12 col-lg-6 col-xl-6 col-xxl-6">
                <form id="frmMensaje" method="POST">
                    <div class="mb-1">
                        <div class="row g-2 align-items-center">
                            <div class="col-12 col-lg-8">
                                <div class="input-box mb-3">
                                    <input type="text" id="txtUsuario" name="txtUsuario"  required>
                                    <label for="txtUsuario">Usuario:</label>
                                </div>   
                            </div>
                            <div class="col-6 col-lg-2 text-center">
                                <label style="color: #4A2545;">Fondo</label>
                                <input type="color" id="colBg" name="colBg" class="form-control form-control-color" required>
                            </div>
                            
                            <div class="col-6 col-lg-2 text-center">
                                <label style="color: #4A2545;">Texto</label>
                                <input type="color" id="colTexto" name="colTexto" class="form-control form-control-color" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-1">
                        <div class="input-box mb-3">
                            <textarea name="txtMensaje" id="txtMensaje" rows="3" placeholder=" " required></textarea>
                            <label for="txtMensaje">Mensaje:</label>
                        </div>
                        
                    </div>
                    <div class="mb-3">
                        <button class="btn btn-purple">Enviar</button>
                    </div>
                </form>
            </div>
            <div class="chat-side">
            <div class="chat-header">Chat con Usarios</div>
            <div class="div-chat" id="chatMessages"></div>

        </div>
        </div>
    </div>
</body>
</html>
