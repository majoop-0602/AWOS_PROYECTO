    <div class="container">
        <div class="row">
             <h1 class="mt-4 mb-4">Foro</h1>
            <div class="col-12 col-sm-12 col-md-12 col-lg-6 col-xl-6 col-xxl-6">
                <form id="frmMensaje" method="POST">
                    <div class="mb-1">
                        <div class="row align-items-end">
                            <div class="col-12 col-lg-8">
                                <label for="txtUsuario">Usuario:</label>
                                <input type="text" id="txtUsuario" name="txtUsuario" class="form-control">
                            </div>
                            <div class="col-6 col-lg-2">
                                <label for="colBg">Color Fondo:</label>
                                <input type="color" id="colBg" name="colBg" class="form-control form-control-color">
                            </div>
                            <div class="col-6 col-lg-2">
                                <label for="colTexto">Color Texto:</label>
                                <input type="color" id="colTexto" name="colTexto" class="form-control form-control-color">
                            </div>
                        </div>
                    </div>
                    <div class="mb-1">
                        <label for="txtMensaje">Mensaje:</label>
                        <textarea name="txtMensaje" id="txtMensaje" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-1">
                        <button class="btn btn-primary">Enviar</button>
                    </div>
                </form>
            </div>
            <div class="chat-side">
            <div class="chat-header">Chat con Usarios</div>
            <div class="div-chat" id="chatMessages"></div>

        </div>
        </div>
    </div>
<script>
        function agregarMensaje(data) {
            const mensaje = JSON.parse(data)
         $(".div-chat").append(`
            <div class="mensaje" 
                style="background: ${mensaje.colorFondo}; color: ${mensaje.colorTexto};">
                <strong>${mensaje.usuario ? mensaje.usuario + ": " : ""}</strong>
                ${mensaje.mensaje}
            </div>
        `)
        $(".div-chat").scrollTop($(".div-chat")[0].scrollHeight);
        }
        // Then some JavaScript in the browser:
        const conn = new WebSocket("ws://localhost:8080/chat")
        conn.onmessage = function (e) {
            const data = e.data
            console.log(data)
            agregarMensaje(data)
        }
        conn.onopen = function (e) {
            conn.send(JSON.stringify({
                colorFondo: "yellow",
                colorTexto: "black",
                usuario: "",
                mensaje: "Alguien se unió al chat."
            }))
        }

        $("#frmMensaje").submit(function (event) {
            event.preventDefault()
            const mensaje = {
                colorFondo: $("#colBg").val(),
                colorTexto: $("#colTexto").val(),
                usuario: $("#txtUsuario").val(),
                mensaje: $("#txtMensaje").val()
            }
            const data = JSON.stringify(mensaje)
            conn.send(data)
            agregarMensaje(data)
            $("#txtMensaje").val("")
        })
    </script>
