    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body id="page/top">
            <nav class="navbar navbar-expand-sm">

                                Cerrar Sesión
                            </button>
                        </li>

    <div id="direccion" class="container">
        
         <form id="frmDirecciones" method="POST">

            <h1 class="mt-4 mb-4">Gestión de Direcciones</h1>
            <div class="input2-1-box mb-3">
                <input type="text" id="txtid" name="txtid"  placeholder=" " readonly>
                <label for="txtid">ID</label>
            </div>
            <div class="input2-box mb-3">
                <select type="text" id="cboUsuario" name="cboUsuario" required>   
                     <option value="" disabled selected hidden></option>     
                </select>
                <label for="cboUsuario">Usuario</label>
            </div>
            <div class="input2-box mb-3">
                <input type="text" id="txtCalle" name="txtCalle" required >
                <label for="txtCalle">Calle</label> 
            </div>
            <div class="input2-box mb-3">
                <input type="text" id="txtCiudad" name="txtCiudad" required >
                <label for="txtCiudad">Ciudad</label>
            </div>
            <div class="input2-box  mb-3">
               
                <select type="text" id="cboEstado" name="cboEstado" required>
                        <option value="" disabled selected hidden></option>
                        <option value="Aguascalientes">Aguascalientes</option>
                        <option value="Baja California">Baja California</option>
                        <option value="Baja California Sur">Baja California Sur</option>
                        <option value="Campeche">Campeche</option>
                        <option value="Chiapas">Chiapas</option>
                        <option value="Chihuahua">Chihuahua</option>
                        <option value="Ciudad de México">Ciudad de México</option>
                        <option value="Coahuila">Coahuila</option>
                        <option value="Colima">Colima</option>
                        <option value="Durango">Durango</option>
                        <option value="Estado de Mexico">Estado de Mexico</option>
                        <option value="Guanajuato">Guanajuato</option>
                        <option value="Guerrero">Guerrero</option>
                        <option value="Hidalgo">Hidalgo</option>
                        <option value="Jalisco">Jalisco</option>
                        <option value="Michoacan">Michoacan</option>
                        <option value="Morelos">Morelos</option>
                        <option value="Nayarit">Nayarit</option>
                        <option value="Nuevo Leon">Nuevo Leon</option>
                        <option value="Oaxaca">Oaxaca</option>
                        <option value="Puebla">Puebla</option>
                        <option value="Queretaro">Queretaro</option>
                        <option value="Quintana Roo">Quintana Roo</option>
                        <option value="San Luis Potosi">San Luis Potosi</option>
                        <option value="Sinaloa">Sinaloa</option>
                        <option value="Sonora">Sonora</option>
                        <option value="Tabasco">Tabasco</option>
                        <option value="Tamaulipas">Tamaulipas</option>
                        <option value="Tlaxcala">Tlaxcala</option>
                        <option value="Veracruz">Veracruz</option>
                        <option value="Yucatan">Yucatan</option>
                        <option value="Zacatecas">Zacatecas</option>
                </select>
                 <label for="cboEstado">Estado:</label>
            </div>
            <div class="input2-box  mb-3">
                <input type="text" id="txtCodigoPostal" name="txtCodigoPostal" required >
                <label for="txtCodigoPostal">Código Postal</label>
            </div>
            <div class="input2-box  mb-3">
                <input type="text" id="txtDescripcion" name="txtDescripcion" required >
                <label for="txtDescripcion">Descripción</label>
            </div>
            <div class="input2-box  mb-3">
                <input type="text" id="txtLatitud" name="txtLatitud" required >
                <label for="txtLatitud">Latitud</label>
            </div>
            <div class="input2-box  mb-3">
                <input type="text" id="txtLongitud" name="txtLongitud" required >
                <label for="txtLongitud">Longitud</label>
            </div>
            <div class="mb-1"><br>
                <button type="submit" class="btn btn-purple">Guardar</button>
                <button type="reset" class="btn btn-purple">Cancelar</button>
            </div>

                
         </form>
            <div id="divMapa" class="container">
                 <h3>Tu ubicación actual:</h3>
            </div>

         <br>
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Calle</th>
                    <th>Ciudad</th>
                    <th>Estado</th>
                    <th>Código Postal</th>
                    <th>Descripción</th>
                    <th>Latitud</th>
                    <th>Longitud</th>
                    <th>Accion</th>
                </thead>
                  <tbody id="tbodyDirecciones"></tbody>
            </table>
    </div>


</body>
</html>
