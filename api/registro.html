<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="js/main.js" defer></script>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body style="background-color: #824C71;">
    <div class="login-container">
    <div class="row mt-5 align-items-center">

        <div class="col-md-6 login-box">
            <form id="frmregistro">
                <h3>Registro</h3>

                <div class="input-box mb-3" >
                    <input type="text" id="txtNombre" name="txtNombre" required>
                    <label  for="txtNombre">Nombre</label>
                </div>
                <div class="input-box mb-3">
                    <input type="email" id="txtEmail" name="txtEmail" required>
                    <label for="txtEmail">Correo Electrónico</label>
                </div>
                <div class="input-box mb-3">
                    <input type="number" id="txtTelefono" name="txtTelefono" required>
                    <label for="txtTelefono">Teléfono</label>
                </div>
                <div class="input-box mb-3">
                    <input type="password" id="txtContrasena" name="txtContrasena" required>
                    <label for="txtContrasena">Contraseña</label>
                </div>

                <div class="mb-3 text-center">
                    <button type="submit" class="btn btn-purple">Registrarse</button>
                </div>
            </form>
        </div>

        <div class="col-md-6">
            <img class="img-login" src="images/imagen_registro.png" alt="imagen_registro">
        </div>

    </div>
</div>
    
</body>
</html>
